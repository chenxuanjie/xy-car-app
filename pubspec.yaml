name: xy_car_app
description: "XY-CAR ground station interface."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.11.5

dependencies:
  app_client:
    path: ../app-foundation/legacy_packages/app_client
  app_core:
    path: ../app-foundation/packages/app_core
  app_identity:
    path: ../app-foundation/packages/app_identity
  app_module_api:
    path: ../app-foundation/packages/app_module_api
  app_settings:
    path: ../app-foundation/packages/app_settings
  app_update:
    path: ../app-foundation/packages/app_update
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  flutter_svg: ^2.3.0
  flutter_webrtc: 1.6.3
  http: ^1.6.0
  package_info_plus: ^8.3.0
  remote_update:
    path: ../app-foundation/legacy_packages/remote_update
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  win32_registry: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/station/
    - assets/ccy/img/
    - assets/ccy/svg/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/ccy/fonts/SpaceGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/ccy/fonts/JetBrainsMono.ttf
    - family: Inter
      fonts:
        - asset: assets/ccy/fonts/Inter.ttf
