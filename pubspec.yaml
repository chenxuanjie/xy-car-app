  http: ^1.6.0
  package_info_plus: ^8.3.0
  remote_update:
    path: ../app-foundation/legacy_packages/remote_update
  shared_preferences: ^2.5.3
  win32_registry: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
