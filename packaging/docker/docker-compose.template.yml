# DSM HTTPS cznas.pp.ua:8090 -> HTTP 127.0.0.1:8089.
services:
  xy-car-web:
    image: xy-car-web:${DOCKER_IMAGE_TAG}
    platform: ${DOCKER_PLATFORM}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      APP_SERVICE_UPSTREAM: http://192.168.1.55:18280
