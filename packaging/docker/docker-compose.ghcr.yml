# DSM HTTPS cznas.pp.ua:8090 -> HTTP 127.0.0.1:8089.
services:
  xy-car-web:
    image: ghcr.io/chenxuanjie/xy-car-app:nas
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      APP_SERVICE_UPSTREAM: http://192.168.1.55:18280
